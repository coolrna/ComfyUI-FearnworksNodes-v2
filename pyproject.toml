[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-fearnworksnodes-v2"
version = "0.1.0"
description = "Modern text, token, and filesystem utility nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Fearnworks Nodes contributors" }]
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fearnworks_nodes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
